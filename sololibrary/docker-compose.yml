version: '3.8'
services:
  db:
    image: postgres:14
    environment:
      POSTGRES_DB: sololibrary
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345679
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/sololibrary
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 12345679

volumes:
  postgres_data: